[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cooperative-traffic-marl"
version = "2.0.0"
description = "Cooperative Smart Traffic Management using Multi-Agent Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ziad Mohamed Gamal" }]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "httpx>=0.26.0", "black>=24.1.0", "ruff>=0.1.0"]
tensorboard = ["tensorboard>=2.15.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "backend*", "core*", "environment*", "evaluation*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
